{# Expects `astroai_series`; used on the home and blog indexes. #}
{% if astroai_series and astroai_series.posts %}
<aside class="mb-12 rounded-2xl border border-purple-200 bg-gradient-to-r from-purple-50 to-blue-50 p-6 sm:p-8" aria-labelledby="astroai-series-title">
    <div class="flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
        <div class="min-w-0 max-w-3xl">
            <p class="mb-2 text-sm font-semibold uppercase tracking-wider text-purple-700">{{ astroai_series.eyebrow }}</p>
            <h2 id="astroai-series-title" class="text-2xl font-bold text-gray-900 sm:text-3xl">{{ astroai_series.title }}</h2>
            <p class="mt-3 text-gray-700">{{ astroai_series.description }}</p>
        </div>
        <a href="/blog/series/{{ astroai_series.slug }}" class="inline-flex shrink-0 items-center justify-center rounded-lg bg-purple-600 px-6 py-3 font-semibold text-white transition-colors hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
            Read the series <span aria-hidden="true" class="ml-2">→</span>
        </a>
    </div>
</aside>
{% endif %}
